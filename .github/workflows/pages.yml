name: Deploy stable site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload verified static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Wait for uploaded artifact to become available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            if [ "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts | any(.name == "github-pages")')" = "true" ]; then
              sleep 5
              exit 0
            fi
            sleep 5
          done
          echo "GitHub Pages artifact is still unavailable after 60 seconds" >&2
          exit 1
      - name: Deploy without downtime
        id: deployment
        uses: actions/deploy-pages@v4
